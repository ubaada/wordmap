expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 128M
upload_max_filesize = 2M
post_max_size = 8M
session.upload_progress.enabled = Off
date.timezone = UTC
opcache.memory_consumption = 32
opcache.interned_strings_buffer = 4
opcache.validate_timestamps = 0
opcache.jit = disable
apc.shm_size = 32M
